services:
  - type: web
    name: sipokteck-portfolio
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: WHATSAPP_PRIMARY
        sync: false
      - key: WHATSAPP_SECONDARY
        sync: false
      - key: SITE_URL
        sync: false
